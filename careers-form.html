<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Careers</title>
  <style>
    body { margin: 0; background: #eeedfc; font-family: Roboto, Helvetica, Arial, sans-serif; }
    .careers-form-embed { max-width: 760px; margin: 0 auto; padding: 16px; }
    .careers-form-embed iframe { display: block; width: 100%; height: 2600px; border: 0; background: #fff; border-radius: 8px; }
    .careers-form-embed .fallback { text-align: center; font-size: 14px; color: #555; margin-top: 12px; }
    .careers-form-embed .fallback a { color: #5746e3; }
  </style>
</head>
<body>
  <!-- Careers form embed: copy everything inside this div into any page -->
  <div class="careers-form-embed">
    <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLSdokeOuae7ykzn79bYqbFM8lKGDfr__TMYPDT5FOS6B7hDEfw/viewform?embedded=true"
      title="Careers – Job Application"
      loading="lazy">Loading…</iframe>
    <p class="fallback">
      Trouble with the form or uploading your resume?
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdokeOuae7ykzn79bYqbFM8lKGDfr__TMYPDT5FOS6B7hDEfw/viewform" target="_blank" rel="noopener">Open it in a new tab</a>.
    </p>
  </div>
</body>
</html>
